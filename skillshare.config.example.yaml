# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json
# Merge these settings into ~/.config/skillshare/config.yaml.
sources:
  # Use your checkout's root; its .skillignore selects only skills/ packages.
  skills: ~/skills-list

# Create one link per enabled skill, preserving unrelated target skills.
mode: merge
# Use names such as workflow-improve and writing-unslop.
target_naming: standard

targets:
  codex:
    skills:
      path: ~/.codex/skills
  # Add other tools you use, for example:
  # claude:
  #   skills:
  #     path: ~/.claude/skills
